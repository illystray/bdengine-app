[package]
name = "bdengine_app"
version = "1.0.17"
description = "Windows desktop shell for https://bdengine.app"
authors = ["BDEngine"]
license = "GPL-3.0-only"
repository = "https://bdengine.app"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "bdengine_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
transport-webview-tests = []

[build-dependencies]
tauri-build = { version = "=2.5.6", features = [] }

[dependencies]
base64 = "0.22"
discord-rich-presence = "1.1.0"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socket2 = "0.6"
tauri = { version = "=2.10.3", features = ["devtools", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-http = { version = "=2.5.9", default-features = false, features = ["rustls-tls", "http2", "charset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2.4.1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = "0.26"
url = "2"
uuid = { version = "1", features = ["v4"] }
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Threading",
  "Win32_Security"
] }
webview2-com = "=0.38.2"

[patch.crates-io]
# Preserve Wry 0.54.4 while allowing native object-message handlers to run.
wry = { path = "../vendor/wry" }
tauri-plugin-http = { path = "../vendor/tauri-plugin-http" }
